# import 'package:gozy/graphql/reservation_payment_fragment.graphql'

mutation createReservation(
    $listId: Int!
    $checkIn: String!
    $checkOut: String!
    $guests: Int!
    $message: String!
    $basePrice: Float!
    $delivery: Float!
    $currency: String!
    $discount: Float
    $discountType: String
    $guestServiceFee: Float
    $hostServiceFee: Float
    $total: Float!
    $bookingType: String
    $cardToken: String
    $paymentType: Int
    $averagePrice: Float
    $days: Int
    $startTime: Float
    $endTime: Float
    $licenseNumber: String!
    $firstName: String!
    $middleName: String
    $lastName: String!
    $dateOfBirth: String!
    $countryCode: String,
    $isDeliveryIncluded: Boolean,
    $paymentCurrency: String,
    $promoCode:String
) {
    createReservation(
        listId: $listId
        checkIn: $checkIn
        checkOut: $checkOut
        guests: $guests
        message: $message
        basePrice: $basePrice
        delivery: $delivery
        currency: $currency
        discount: $discount
        discountType: $discountType
        guestServiceFee: $guestServiceFee
        hostServiceFee: $hostServiceFee
        total: $total
        bookingType: $bookingType
        cardToken: $cardToken
        paymentType: $paymentType
        averagePrice: $averagePrice
        days: $days
        startTime: $startTime
        endTime: $endTime
        licenseNumber: $licenseNumber
        firstName: $firstName
        middleName: $middleName
        lastName: $lastName
        dateOfBirth: $dateOfBirth
        countryCode: $countryCode
        isDeliveryIncluded: $isDeliveryIncluded
        paymentCurrency: $paymentCurrency
        promoCode:$promoCode
    ) {
    ...reservationPaymentFragment
    }
}