# import 'package:gozy/graphql/base_listing_info_fragment.graphql'

query CancellationData(
    $reservationId: Int!,
    $userType: String!,
    $currency: String
) {
  cancelReservationData(
    reservationId: $reservationId,
    userType: $userType,
    currency: $currency
  ) {
   results {
reservationId
        cancellationPolicy
        refundToGuest
        payoutToHost
        threadId
        checkIn
        checkOut
        startTime
        endTime
        guests
        cancelledBy
        startedIn
        rentingFor
        currency
        hostEmail
        listId
        guestServiceFee
        hostServiceFee
        total
        confirmationCode
        listTitle
        nonRefundableDayPrice
        guestEmail
        hostName
        status
        guestName
        errorMessage
        hostProfilePicture
        guestProfilePicture
        listData{
       ...viewListingShortFragment
       user {
           email
                   profile{
                   profileId
                   firstName
                   lastName
                   displayName
                   dateOfBirth
                   picture
                   location
                   info
                   createdAt
           }
           verification{
                   id
                   userId
                   isEmailConfirmed
                   isFacebookConnected
                   isGoogleConnected
                   isIdVerification
                   isPhoneVerified
                   status
           }
           userBanStatus
       }

   }
        isSpecialPriceAverage
        guestCreatedAt
        hostCreatedAt
   }
    status
    errorMessage
  }
}

#Cancellation
mutation CancelReservation(
        $reservationId: Int!,
$cancellationPolicy: String!,
$refundToGuest: Float!,
$payoutToHost: Float!
$guestServiceFee: Float!
$hostServiceFee: Float!
$total: Float!,
$currency: String!,
$threadId: Int!,
$cancelledBy: String!
$message: String!,
$checkIn: String!,
$checkOut: String!
$guests: Int!,
$startTime: Float!,
$endTime: Float!
) {
cancelReservation:CancelReservation(
        reservationId: $reservationId,
cancellationPolicy: $cancellationPolicy,
refundToGuest: $refundToGuest,
payoutToHost: $payoutToHost
        guestServiceFee: $guestServiceFee,
hostServiceFee: $hostServiceFee,
total: $total,
currency: $currency,
threadId: $threadId,
cancelledBy: $cancelledBy,
message: $message,
checkIn: $checkIn,
checkOut: $checkOut
        guests: $guests,
startTime: $startTime,
endTime: $endTime
) {
status
        errorMessage

}

}